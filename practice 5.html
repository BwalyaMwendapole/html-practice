<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
        content="width=device-width initial scale=1.0">
        <title>practice day 5</title>
    </head>
    <body>
        <header>
            <h1>Programming Club</h1>
            <p>A student club at ALTE University</p>
        </header>
        <nav>
            <ul>
                <li><a href ="#about">About</a></li>
                <li><a href ="#schedule">Schedule</a></li>
                <li><a href ="#join">Join</a></li>
            </ul>
        </nav>
        <main>
        <section id="about">
            <h2>About Us</h2>
            <p>The club brings together <strong>student</strong> who learn <em>programming.</em> </p>
            <p><img src alt="Club members at a meeting"></p>
        </section>
        <section id="schedule">
            <h2>Schedule</h2>
            <table>
                <tr><th>Day</th>      <th>Time</th>  <th>Activity</th>   </tr>
                <tr><td>Monday</td>   <td>17:00</td> <td>Meeting</td>    </tr>
                <tr><td>Wednesday</td><td>18:00</td> <td>seminar</td>    </tr>
                <tr><td>Friday</td>   <td>16:00</td> <td>Project work</td></tr>
            </table>
        </section>
        <section id="join">
        <form>
            <h2>Join</h2>
            <label for="Name:">Name</label>
            <input type="name" name="name"  id="Name" required> 
            <label for="E-mail:">E-mail</label>
            <input type="E-mail" name="username">
            <label for="Message">Message</label>
            <textarea id="message" name="message" row="2" col="25"></textarea>
            <button type="Join">join</button>
        </section>
        </form>
        <footer>
            <p>&copy 2026 Programming Club</p>
        </footer>
        </main>
    </body>
</html>
